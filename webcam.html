<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webcam</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font-family:system-ui,sans-serif}
  main{display:grid;gap:12px;justify-items:center;padding:16px}
  video{max-width:100%;width:640px;border-radius:8px;background:#000}
  button{padding:10px 18px;font-size:16px;cursor:pointer}
  p{margin:0;color:#f88}
</style>
</head>
<body>
<main>
  <video id="v" autoplay playsinline muted></video>
  <button id="b">Abrir webcam</button>
  <p id="e"></p>
</main>
<script>
const v=document.getElementById('v'),b=document.getElementById('b'),e=document.getElementById('e');
let stream=null;
b.onclick=async()=>{
  e.textContent='';
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;b.textContent='Abrir webcam';return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:true});
    v.srcObject=stream;b.textContent='Fechar webcam';
  }catch(err){e.textContent='Não foi possível abrir a câmera: '+err.message;}
};
</script>
</body>
</html>
